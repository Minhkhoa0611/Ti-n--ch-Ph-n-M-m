<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MK SOF - Soạn thảo code Online</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f4f4f4 100%);
            margin: 0;
            min-height: 100vh;
        }
        .container {
            max-width: 100vw;
            width: 100vw;
            margin: 0;
            background: #fff;
            padding: 0 0 32px 0;
            border-radius: 0;
            box-shadow: none;
            min-height: 100vh;
        }
        .tab-menu {
            display: flex;
            justify-content: center;
            margin-bottom: 0;
            gap: 8px;
            padding-top: 24px;
        }
        .tab-btn {
            padding: 10px 28px;
            border: none;
            background: #e0e7ff;
            color: #2563eb;
            font-size: 1.08rem;
            font-weight: 500;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            outline: none;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab-btn.active, .tab-btn:focus {
            background: #fff;
            color: #22223b;
            border-bottom: 2px solid #fff;
            box-shadow: 0 -2px 8px #e0e7ff60;
            z-index: 2;
        }
        h1 {
            text-align: center;
            color: #2d3a4b;
            margin: 24px 0 18px 0;
        }
        .editor-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .editor-bar select, .editor-bar button {
            padding: 7px 14px;
            border-radius: 6px;
            border: 1px solid #e0e7ff;
            font-size: 1rem;
            background: #f6f8fa;
            color: #22223b;
            margin-right: 2px;
            cursor: pointer;
        }
        .editor-bar button {
            background: linear-gradient(90deg, #6366f1 60%, #60a5fa 100%);
            color: #fff;
            border: none;
            font-weight: 500;
            transition: background 0.2s;
        }
        .editor-bar button:hover {
            background: linear-gradient(90deg, #4f46e5 60%, #2563eb 100%);
        }
        .editor-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100vw;
            max-width: 100vw;
        }
        #code-input {
            width: 90vw;
            max-width: 900px;
            min-height: 260px;
            font-family: 'Fira Mono', 'Consolas', monospace;
            font-size: 1.08rem;
            background: #f6f8fa;
            border: 1.5px solid #e0e7ff;
            border-radius: 8px;
            padding: 16px 14px;
            margin-bottom: 18px;
            resize: vertical;
            color: #22223b;
            box-shadow: 0 2px 8px #e0e7ff30;
            transition: border 0.2s;
        }
        #code-input:focus {
            border: 1.5px solid #6366f1;
            outline: none;
        }
        #output {
            width: 90vw;
            max-width: 900px;
            min-height: 120px;
            background: #e0e7ff;
            border-radius: 8px;
            padding: 14px 14px;
            font-family: 'Fira Mono', 'Consolas', monospace;
            font-size: 1.05rem;
            color: #374151;
            margin-top: 0;
            white-space: pre-wrap;
            word-break: break-all;
            box-shadow: 0 2px 8px #e0e7ff30;
        }
        .output-label {
            color: #6366f1;
            font-weight: bold;
            margin-bottom: 4px;
            margin-top: 0;
        }
        @media (max-width: 600px) {
            .editor-bar { flex-direction: column; gap: 8px; }
            #code-input, #output { width: 98vw; max-width: 98vw; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tab-menu">
            <a class="tab-btn" href="index.html"><i class="fa-solid fa-box"></i> Phần mềm</a>
            <a class="tab-btn" href="cmd.html"><i class="fa-solid fa-terminal"></i> Lệnh tối ưu</a>
            <a class="tab-btn" href="browser-tools.html"><i class="fa-solid fa-puzzle-piece"></i> Tiện ích trình duyệt</a>
            <a class="tab-btn" href="github-hot.html"><i class="fa-brands fa-github"></i> GitHub hay</a>
            <a class="tab-btn active" href="dev-tools.html"><i class="fa-solid fa-wrench"></i> Dev tools</a>
            <a class="tab-btn" href="about.html"><i class="fa-solid fa-circle-info"></i> Giới thiệu</a>
        </div>
        <h1>Soạn thảo & chạy code Online</h1>
        <div class="editor-bar">
            <label for="lang">Ngôn ngữ:</label>
            <select id="lang">
                <option value="js">JavaScript</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
            </select>
            <button onclick="runCode()"><i class="fa-solid fa-play"></i> Chạy code</button>
            <button onclick="clearCode()"><i class="fa-solid fa-eraser"></i> Xóa</button>
            <button onclick="copyCode()"><i class="fa-solid fa-copy"></i> Copy</button>
        </div>
        <div class="editor-wrap">
            <textarea id="code-input" spellcheck="false" placeholder="// Nhập code tại đây..."></textarea>
            <div class="output-label">Kết quả / Output:</div>
            <div id="output"></div>
        </div>
    </div>
    <script>
    const codeInput = document.getElementById('code-input');
    const output = document.getElementById('output');
    const lang = document.getElementById('lang');

    function runCode() {
        const code = codeInput.value;
        output.innerHTML = '';
        if (lang.value === 'js') {
            try {
                // eslint-disable-next-line no-eval
                let result = eval(code);
                if (typeof result === 'undefined') result = '';
                output.textContent = result;
            } catch (e) {
                output.textContent = 'Lỗi: ' + e;
            }
        } else if (lang.value === 'html') {
            output.innerHTML = code;
        } else if (lang.value === 'css') {
            output.innerHTML = '<style>' + code + '</style><div style="padding:8px 0;">CSS đã áp dụng cho vùng này.<br><span style="font-weight:bold;">.output-demo</span></div><div class="output-demo" style="padding:12px 18px;background:#fff;border-radius:6px;">Demo CSS</div>';
            const style = document.createElement('style');
            style.innerHTML = code;
            output.appendChild(style);
        }
    }
    function clearCode() {
        codeInput.value = '';
        output.textContent = '';
    }
    function copyCode() {
        codeInput.select();
        document.execCommand('copy');
    }
    </script>
</body>
</html>
