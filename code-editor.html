<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Code Edit By Minh khoa - HTML</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        #titlebar {
            height: 32px;
            background: #23272e;
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 15px;
            letter-spacing: 1px;
            user-select: none;
        }
        #main {
            flex: 1;
            display: flex;
            min-height: 0;
        }
        #editors-preview-layout {
            flex: 1;
            display: flex;
            min-width: 0;
        }
        #sidebar {
            width: 48px;
            background: #2c2c32;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 8px;
        }
        .sidebar-icon {
            width: 32px;
            height: 32px;
            margin: 8px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 6px;
        }
        .sidebar-icon.active, .sidebar-icon:hover {
            background: #37373d;
        }
        #explorer {
            width: 220px;
            background: #252526;
            color: #d4d4d4;
            padding: 8px 0;
            font-size: 14px;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
        }
        #explorer-title {
            padding: 8px 16px;
            font-weight: bold;
            letter-spacing: 1px;
            border-bottom: 1px solid #222;
        }
        #explorer-files {
            flex: 1;
            padding: 8px 0 0 16px;
        }
        .explorer-file {
            padding: 4px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .explorer-file:hover {
            background: #333;
        }
        #editors {
            flex: 1 1 0;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        #editor-tabs {
            height: 32px;
            background: #23272e;
            display: flex;
            align-items: center;
            padding-left: 8px;
            border-bottom: 1px solid #222;
        }
        .editor-tab {
            padding: 0 16px;
            height: 100%;
            display: flex;
            align-items: center;
            cursor: pointer;
            color: #d4d4d4;
            border-right: 1px solid #222;
        }
        .editor-tab.active {
            background: #1e1e1e;
            color: #fff;
            font-weight: bold;
        }
        #editor-area {
            flex: 1;
            display: flex;
        }
        .editor-container {
            flex: 1;
            display: none;
            flex-direction: column;
            min-width: 0;
        }
        .editor-container.active {
            display: flex;
        }
        .editor-title { display: none; }
        .editor { flex: 1; min-height: 0; }
        #preview-side {
            width: 40%;
            min-width: 320px;
            max-width: 600px;
            background: #222;
            border-left: 1px solid #222;
            display: flex;
            flex-direction: column;
        }
        #preview-label {
            height: 32px;
            background: #23272e;
            color: #fff;
            display: flex;
            align-items: center;
            padding-left: 12px;
            font-size: 14px;
            border-bottom: 1px solid #222;
            letter-spacing: 1px;
        }
        #preview-frame {
            flex: 1;
            border: none;
            background: #fff;
        }
        /* Khi tab Preview được chọn, ẩn editors, preview chiếm toàn bộ */
        #editors-preview-layout.preview-full #editors {
            display: none;
        }
        #editors-preview-layout.preview-full #preview-side {
            width: 100%;
            max-width: none;
            min-width: 0;
        }
    </style>
    <!-- Monaco Editor loader -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
</head>
<body>
    <div id="titlebar">
        <span style="font-weight:bold; color:#4fc3f7; margin-right:8px;">&#x25A1;</span>
        Code Edit By Minh khoa - HTML
    </div>
    <div id="main">
        <div id="sidebar">
            <div class="sidebar-icon active" title="Explorer">
                <!-- Explorer icon SVG -->
                <svg width="20" height="20" fill="#d4d4d4"><rect x="2" y="3" width="16" height="14" rx="2" fill="#d4d4d4"/><rect x="5" y="6" width="10" height="8" rx="1" fill="#23272e"/></svg>
            </div>
            <div class="sidebar-icon" title="Search">
                <!-- Search icon SVG -->
                <svg width="20" height="20" fill="#d4d4d4"><circle cx="9" cy="9" r="6" stroke="#d4d4d4" stroke-width="2" fill="none"/><line x1="15" y1="15" x2="19" y2="19" stroke="#d4d4d4" stroke-width="2"/></svg>
            </div>
            <div class="sidebar-icon" title="Source Control">
                <!-- Source Control icon SVG -->
                <svg width="20" height="20" fill="#d4d4d4"><circle cx="10" cy="6" r="3" fill="#d4d4d4"/><circle cx="10" cy="14" r="3" fill="#d4d4d4"/><rect x="9" y="9" width="2" height="2" fill="#d4d4d4"/></svg>
            </div>
            <div class="sidebar-icon" title="Run & Debug">
                <!-- Run icon SVG -->
                <svg width="20" height="20" fill="#d4d4d4"><polygon points="6,4 16,10 6,16" fill="#d4d4d4"/></svg>
            </div>
        </div>
        <div id="explorer">
            <div id="explorer-title">EXPLORER</div>
            <div id="explorer-files">
                <div class="explorer-file" data-tab="html">
                    <svg width="16" height="16" style="margin-right:6px;"><rect width="16" height="16" rx="3" fill="#e34c26"/></svg>
                    index.html
                </div>
                <div class="explorer-file" data-tab="css">
                    <svg width="16" height="16" style="margin-right:6px;"><rect width="16" height="16" rx="3" fill="#563d7c"/></svg>
                    style.css
                </div>
                <div class="explorer-file" data-tab="js">
                    <svg width="16" height="16" style="margin-right:6px;"><rect width="16" height="16" rx="3" fill="#f7df1e"/></svg>
                    script.js
                </div>
                <div class="explorer-file" data-tab="preview">
                    <svg width="16" height="16" style="margin-right:6px;"><rect width="16" height="16" rx="3" fill="#4fc3f7"/></svg>
                    Preview
                </div>
            </div>
        </div>
        <div id="editors-preview-layout">
            <div id="editors">
                <div id="editor-tabs">
                    <div class="editor-tab active" data-tab="html">index.html</div>
                    <div class="editor-tab" data-tab="css">style.css</div>
                    <div class="editor-tab" data-tab="js">script.js</div>
                    <div class="editor-tab" data-tab="preview">Preview</div>
                </div>
                <div id="editor-area">
                    <div id="html-editor-container" class="editor-container active">
                        <div id="html-editor" class="editor"></div>
                    </div>
                    <div id="css-editor-container" class="editor-container">
                        <div id="css-editor" class="editor"></div>
                    </div>
                    <div id="js-editor-container" class="editor-container">
                        <div id="js-editor" class="editor"></div>
                    </div>
                </div>
            </div>
            <div id="preview-side">
                <div id="preview-label">Preview</div>
                <iframe id="preview-frame"></iframe>
            </div>
        </div>
    </div>
    <script>
        require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' }});
        window.MonacoEnvironment = { getWorkerUrl: () => proxy };
        let proxy = URL.createObjectURL(new Blob([`
            self.MonacoEnvironment = {baseUrl: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/'};
            importScripts('https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/base/worker/workerMain.js');
        `], { type: 'text/javascript' }));

        require(['vs/editor/editor.main'], function () {
            const htmlEditor = monaco.editor.create(document.getElementById('html-editor'), {
                value: "<!-- Write HTML here -->\n<h1>Hello World!</h1>",
                language: 'html',
                theme: 'vs-dark',
                automaticLayout: true
            });
            const cssEditor = monaco.editor.create(document.getElementById('css-editor'), {
                value: "/* Write CSS here */\nh1 { color: red; }",
                language: 'css',
                theme: 'vs-dark',
                automaticLayout: true
            });
            const jsEditor = monaco.editor.create(document.getElementById('js-editor'), {
                value: "// Write JS here\nconsole.log('Hello World!');",
                language: 'javascript',
                theme: 'vs-dark',
                automaticLayout: true
            });

            function updatePreview() {
                const html = htmlEditor.getValue();
                const css = `<style>${cssEditor.getValue()}</style>`;
                const js = `<script>${jsEditor.getValue()}<\/script>`;
                const src = html + css + js;
                document.getElementById('preview-frame').srcdoc = src;
            }

            htmlEditor.onDidChangeModelContent(updatePreview);
            cssEditor.onDidChangeModelContent(updatePreview);
            jsEditor.onDidChangeModelContent(updatePreview);

            updatePreview();

            // Tab switching logic
            function activateTab(tab) {
                // Tab UI
                document.querySelectorAll('.editor-tab').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.editor-container').forEach(el => el.classList.remove('active'));
                document.querySelector(`.editor-tab[data-tab="${tab}"]`).classList.add('active');
                if(tab !== 'preview') {
                    document.getElementById(tab + '-editor-container')?.classList.add('active');
                }
                // Layout logic
                const layout = document.getElementById('editors-preview-layout');
                if(tab === 'preview') {
                    layout.classList.add('preview-full');
                } else {
                    layout.classList.remove('preview-full');
                }
            }
            document.querySelectorAll('.editor-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    activateTab(tab.getAttribute('data-tab'));
                });
            });
            document.querySelectorAll('.explorer-file').forEach(file => {
                file.addEventListener('click', () => {
                    activateTab(file.getAttribute('data-tab'));
                });
            });
        });
    </script>
</body>
</html>
